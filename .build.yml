image: archlinux
packages:
  - python-pip
  - python-yaml
  - python-requests
sources:
  - https://git.sr.ht/~taum/sanshainConan
tasks:
  - setup: |
      pip install conan
  - build: |
      cd sanshainConan
      # This is a python_requires project, we just verify it can be "exported" or similar
      conan export .
