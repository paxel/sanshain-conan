image: alpine/edge
packages:
  - py3-pip
sources:
  - https://git.sr.ht/~taum/sanshainConan
tasks:
  # A plain pip package since 2.0: the python_requires recipe (and its
  # `conan export` smoke test) is gone — consumers `pip install sanshain-conan`
  # and import the helper in their conanfile.
  - test: |
      cd sanshainConan
      pip install --break-system-packages pytest requests pyyaml
      python3 -m pytest tests/ -q
