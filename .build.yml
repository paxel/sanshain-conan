image: archlinux
packages:
  - gcc
  - cmake
  - python-pip
  - python-yaml
  - python-requests
  - python-conan
sources:
  - https://git.sr.ht/~taum/sanshainConan
tasks:
  - setup_conan: |
      # Create a virtual environment to avoid "externally-managed-environment" errors
      python -m venv venv
      source venv/bin/activate
      pip install conan
      conan profile detect --force
  - build: |
      cd sanshainConan
      # This is a python_requires project, we just verify it can be "exported" or similar
      conan export .
