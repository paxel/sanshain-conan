image: alpine/edge
packages:
  - py3-pip
  - build-base
  - cmake
sources:
  - https://git.sr.ht/~taum/sanshainConan
tasks:
  - setup: |
      pip install --break-system-packages conan 
      /home/build/.local/bin/conan profile detect
  - build: |
      cd sanshainConan
      # This is a python_requires project, we just verify it can be "exported" or similar
      /home/build/.local/bin/conan export .
