# Release on tag: `git tag v2.5.1 && git push github v2.5.1` produces everything.
#
#   version      - the tag names the version pyproject.toml carries
#   gate         - paxel/gates release-gate.yml: no open alert or SonarQube Cloud finding that
#                  is not accepted, no known vulnerability, no licence outside the allowlist,
#                  and a CHANGELOG section for the version
#   build        - the tests on the tagged commit, then the wheel and the source distribution,
#                  built once
#   provenance   - paxel/gates provenance.yml: a CycloneDX SBOM of the source, signed build
#                  provenance for every file and its Sigstore bundle as a file of its own
#   release      - GitHub Release, notes = the CHANGELOG section for the tag, with every file
#                  of the jobs before
#   publish-pypi - those same two files to PyPI, with PyPI's own attestations
#
# PyPI auth is Trusted Publishing (OIDC): no stored token. It takes the `id-token` permission
# plus a trusted-publisher entry on the PyPI project pointing at this repository and this
# workflow file. The first publish of the name happened by hand, so the project exists to
# configure the publisher on.
#
# One-time setup (repository secrets):
#   GATES_ALERTS_TOKEN - read access to the repository's alerts, for the release gate
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the jobs that write the GitHub Release and publish to PyPI widen this
# themselves.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mistake a hand-cut tag makes: tagging v2.1.0 without bumping the manifest. PyPI
      # publishes what pyproject.toml says, so the tag would name a version nobody can install.
      - name: Tag matches the package version
        run: |
          ver=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "::error::tag v$tag != package version $ver" >&2; exit 1; }
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@e5e253a7caff277f039fb31a3e6be1479682dcc4 # v1.2.0
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build:
    name: Wheel and source distribution
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python .python-version pins, the one CI tested with.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Only the locked versions, only wheels: no dependency is built from its source archive,
      # which would run its setup code here. The project itself is the one exception.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package sanshain-conan --all-extras --dev
      - name: Tests
        run: uv run --locked --no-build --no-binary-package sanshain-conan pytest
      # Built once: these two files are attested, attached to the GitHub Release and published
      # to PyPI.
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-pypi
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  provenance:
    needs: build
    uses: paxel/gates/.github/workflows/provenance.yml@e5e253a7caff277f039fb31a3e6be1479682dcc4 # v1.2.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: sanshain-conan
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wheel and the source distribution, with the SBOM and the Sigstore bundle beside
      # them: `gh attestation verify <file> -R paxel/sanshain-conan` checks a download, with
      # `--bundle <the sigstore file>` offline.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      # softprops updates an existing release rather than failing on it, so a re-run for
      # the same tag is safe.
      - name: Create or update the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

  publish-pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      # The two files the build job built, the ones that were attested and attached. Not the
      # release-files artifact: it also holds the SBOM and the Sigstore bundle, which are no
      # distributions and PyPI would refuse.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-pypi
          path: dist/
      - name: Publish to PyPI (trusted publishing, skipping published versions)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A PyPI version is immutable: a re-run (or the tag after a publish by hand) must
          # skip what already landed instead of failing.
          skip-existing: true
          # PyPI's own attestation for each file, signed with the identity of this workflow.
          attestations: true
