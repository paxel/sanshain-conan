# Release on tag: `git tag v2.0.0 && git push github v2.0.0` produces the
# GitHub Release and the PyPI publish.
#
# PyPI auth is Trusted Publishing (OIDC): no stored token — the `id-token`
# permission plus a trusted-publisher entry on the PyPI project pointing at
# this repository and this workflow file. The first publish of the name happens
# manually, so the project exists to configure the publisher on.
name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release and publish jobs get more.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.11'
          enable-cache: true
      # The mistake a hand-cut tag makes: tagging v2.1.0 without bumping the
      # manifest. PyPI publishes what pyproject.toml says, so the tag would
      # name a version nobody can install.
      - name: Tag matches the package version
        run: |
          ver=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != package version $ver" >&2; exit 1; }
      # The locked versions as wheels only, without installing the project: the
      # tests import it from the checkout. Building the package is the next step.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --all-extras --dev
      - name: Tests
        run: uv run --locked --no-build --no-sync python -m unittest discover tests
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: CHANGELOG.md

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A PyPI version is immutable — a re-run (or the tag after the manual
          # first publish) must skip what already landed instead of failing.
          skip-existing: true
