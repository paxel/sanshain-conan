name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.11'
        enable-cache: true
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
