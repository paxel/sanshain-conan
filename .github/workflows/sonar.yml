# SonarQube Cloud analysis of summer on every push there; the free plan
# analyses the main branch only. Report only: the quality gate shows on
# https://sonarcloud.io/summary/new_code?id=paxel_sanshain-conan and fails no
# build. Coverage comes from the same unittest run. What is analysed is in
# sonar-project.properties.
#
# One-time setup: the project paxel_sanshain-conan on SonarQube Cloud with
# Automatic Analysis off, and the repository secret SQ_TOKEN.
name: SonarQube Cloud

on:
  push:
    branches: [summer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      # The full history for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: true
      # The locked versions (coverage is a dev dependency) as wheels only,
      # without installing the project: the tests import it from the checkout.
      - run: uv sync --locked --no-build --no-install-project --all-extras --dev
      - name: Tests with coverage
        run: |
          uv run --locked --no-build --no-sync coverage run --source=sanshainconan -m unittest discover tests
          uv run --locked --no-build --no-sync coverage xml -o coverage.xml
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
