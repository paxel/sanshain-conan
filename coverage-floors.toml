# The coverage ratchet (paxel/gates coverage_ratchet.py): one part per measured package. CI
# writes coverage/python.lcov and fails below the floor. After a rise, run the commands
# AGENTS.md names; the ratchet raises the floor to the measured value minus 0.1 and writes
# .github/badges/coverage-python.json. Commit both with the change that earned them.

[[parts]]
name = "python"
lcov = "coverage/python.lcov"
floor = 91.99
