# osv-scanner's exceptions, read by the OSV gate (paxel/gates vulns.yml). Each one says why
# the repository is not exposed and why no update removes it, and carries a date; when the
# date passes, the gate fails again: that is the review.
#
# An advisory:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-05-14
# reason = "..."
#
# A licence outside the standard's allowlist (one package):
# [[PackageOverrides]]
# name = "some-package"
# ecosystem = "PyPI"
# license.ignore = true
# effectiveUntil = 2027-05-14
# reason = "..."
#
# CI and the release list a notice that a package is unmaintained without failing; the weekly
# Security run fails on it.

# Both come with the tools that check the package (mypy, pytest). Neither is in the published
# package or among its dependencies.
[[PackageOverrides]]
name = "typing-extensions"
ecosystem = "PyPI"
license.ignore = true
effectiveUntil = 2027-02-18
reason = """typing-extensions is under PSF-2.0, Python's own licence: permissive, it asks for \
the licence text and the copyright notice to stay with the code. It comes only through mypy, \
which checks the types, and is installed for that only. No release carries another licence."""

[[PackageOverrides]]
name = "colorama"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]
effectiveUntil = 2027-02-18
reason = """deps.dev reports colorama's licence as non-standard; its LICENSE.txt is the \
3-clause BSD licence. It comes only through pytest on Windows and is installed for the tests \
only."""
