[project]
name = "sanshain-conan"
version = "2.1.0"
description = "Conan extension for Sanshain OpenAPI service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/paxel/sanshain-conan"

[project.scripts]
sanshain-conan = "sanshainconan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanshainconan"]

[dependency-groups]
dev = [
    "flake8",
    "black",
    "bandit",
    "mypy",
    "types-requests",
    "types-PyYAML",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
