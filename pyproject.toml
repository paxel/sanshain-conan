[project]
name = "sanshain-conan"
version = "2.5.0"
description = "Conan extension for Sanshain OpenAPI service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/paxel/sanshain-conan"

[project.scripts]
sanshain-conan = "sanshainconan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanshainconan"]

[dependency-groups]
# The tools that check the package: the commands of the shared Python gate.
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "types-requests",
    "types-PyYAML",
]

[tool.mypy]
strict = true
# The oldest Python the package runs on (requires-python): the types are checked against it.
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sanshainconan"]
# The Cobertura XML then names sanshainconan/, not the runner path of the job that measured
# it; SonarQube Cloud reads it in another job.
relative_files = true
