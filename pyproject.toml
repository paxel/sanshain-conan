[project]
name = "sanshain-conan"
version = "2.5.1"
description = "Conan extension for Sanshain OpenAPI service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/paxel/sanshain-conan"

[project.scripts]
sanshain-conan = "sanshainconan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanshainconan"]

[tool.hatch.build.targets.sdist]
# The fuzz targets check the package; they are not part of what is published.
exclude = ["/fuzz"]

[dependency-groups]
# The tools that check the package: the commands of the shared Python gate.
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "types-requests",
    "types-PyYAML",
    # The fuzzer of the targets in fuzz/. It has wheels for Python 3.12 and later only, so the
    # tests on Python 3.11 install without it.
    "atheris==3.1.0; python_version >= '3.12'",
]

[tool.mypy]
strict = true
# The oldest Python the package runs on (requires-python): the types are checked against it.
python_version = "3.11"

[[tool.mypy.overrides]]
# atheris ships no types; only the fuzz targets import it.
module = ["atheris"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sanshainconan"]
# The Cobertura XML then names sanshainconan/, not the runner path of the job that measured
# it; SonarQube Cloud reads it in another job.
relative_files = true
