# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-conan
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-conan
sonar.projectName=sanshain-conan

# The package and the workflows; the tests count as tests.
sonar.sources=sanshainconan,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage: the shared Python gate runs the tests with coverage and keeps coverage/python.xml,
# which the sonar job downloads.
sonar.python.coverage.reportPaths=coverage/python.xml
