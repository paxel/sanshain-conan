# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-conan
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-conan
sonar.projectName=sanshain-conan

# The package and the workflows.
sonar.sources=sanshainconan,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage: the workflow's coverage run of the unittest suite.
sonar.python.coverage.reportPaths=coverage.xml

# Accepted findings, each limited to its rule and its single file, so a new
# file with the same finding is still reported.
sonar.issue.ignore.multicriteria=configfile,namedfiles,catalogfile

# A CLI reading the sanshain.yaml the user names with --config (or the
# conanfile.py helper's config_path); reading it is the tool's purpose.
sonar.issue.ignore.multicriteria.configfile.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.configfile.resourceKey=sanshainconan/config.py
# The CLI reads the spec files and writes the require output that the user's
# sanshain.yaml names, relative to it.
sonar.issue.ignore.multicriteria.namedfiles.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.namedfiles.resourceKey=sanshainconan/cli.py
# The catalog step reads the catalogInfo file the user's sanshain.yaml names,
# relative to it.
sonar.issue.ignore.multicriteria.catalogfile.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.catalogfile.resourceKey=sanshainconan/catalog.py
